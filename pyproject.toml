[project]
name = "accrual"
version = "0.1.0"
description = "채권 경과이자 및 유효이자율법 상각 계산"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accrual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
